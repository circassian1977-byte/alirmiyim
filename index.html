<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alır mıyım? — Bütçene göre en sorunsuz kasa</title>
<meta name="description" content="Bütçeni, markayı ve istersen modeli gir; o paraya en sorunsuz kasayı, kronik arızalarını ve ekspertiz kontrol listesini gör. Arıza ışıklarını da tanı.">
<link rel="canonical" href="https://alirmiyim.com/">
<meta property="og:title" content="Alır mıyım? — Bütçene göre en sorunsuz kasa">
<meta property="og:description" content="Bütçeni, markayı ve istersen modeli gir; en sorunsuz kasayı, kronik arızalarını ve ekspertiz kontrol listesini gör.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alirmiyim.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23151a23'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23ffb020'%3E%3F%3C/text%3E%3C/svg%3E">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Alır mıyım?","url":"https://alirmiyim.com/","description":"Bütçene göre en sorunsuz araç kasasını, kronik arızalarını ve ekspertiz kontrol listesini gösteren ikinci el araç alım rehberi.","applicationCategory":"LifestyleApplication","operatingSystem":"Web","inLanguage":"tr"}
</script>
<style>
  :root{
    --bg:#0b0e14; --surface:#151a23; --surface2:#1c2330; --border:rgba(255,255,255,.08);
    --fg:#eef1f6; --muted:#9aa4b2; --subtle:#6b7484;
    --accent:#ffb020; --accent-fg:#1a1200;
    --red:#e2543e; --orange:#e8a33e; --bad:#e2543e; --warn:#e8b93e; --good:#6bcb4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
  .tab{flex:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--subtle);margin-bottom:6px}
  .field{width:100%;padding:12px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:15px}
  .field:disabled{opacity:.5}
  .row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
  .row.two{grid-template-columns:1fr 1fr}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-size:15px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--surface2);color:var(--fg);border:1px solid var(--border)}
  .hint{font-size:12px;color:var(--subtle);margin-top:8px}
  .result{margin-top:18px}
  .result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .result-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .result-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.ok{background:rgba(107,203,74,.15);color:var(--good)}
  .badge.warn{background:rgba(232,169,62,.15);color:var(--warn)}
  .badge.bad{background:rgba(226,84,62,.15);color:var(--bad)}
  .price{font-size:24px;font-weight:800;margin:14px 0 2px}
  .price-range{font-size:13px;color:var(--subtle)}
  .risk-bar{height:6px;border-radius:99px;background:var(--surface2);margin:10px 0;overflow:hidden}
  .risk-fill{height:100%;border-radius:99px}
  .section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:20px 0 10px}
  .chronic-row{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:8px;border-left:3px solid}
  .chronic-row.freq-sik{background:rgba(226,84,62,.12);border-color:var(--red)}
  .chronic-row.freq-diger{background:rgba(232,163,62,.12);border-color:var(--orange)}
  .chronic-title{font-weight:700;font-size:14px}
  .chronic-meta{font-size:11px;color:var(--subtle);margin-top:1px}
  .chronic-symptoms{font-size:13px;color:var(--muted);margin-top:4px}
  .freq-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;height:fit-content}
  .freq-tag.freq-sik{background:var(--red);color:#fff}
  .freq-tag.freq-diger{background:var(--orange);color:#1a1200}
  .ek-item{padding:10px 0;border-bottom:1px solid var(--border)}
  .ek-item:last-child{border-bottom:none}
  .ek-item .item{font-size:14px;font-weight:600}
  .ek-item .why{font-size:13px;color:var(--muted);margin-top:2px}
  .link-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--accent-fg);text-decoration:none;margin-top:14px;background:var(--accent);border-radius:12px;padding:14px 16px;min-height:48px}
  .link-btn:active{opacity:.85}
  .brand-list{display:flex;flex-direction:column;gap:8px}
  .brand-list li{list-style:none}
  .brand-list button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--fg);text-align:left;cursor:pointer}
  .brand-list .bl-name{font-size:14px;font-weight:600}
  .brand-list .bl-gen{font-size:12px;color:var(--subtle)}
  .brand-list .bl-price{font-size:14px;font-weight:700;text-align:right}
  .brand-list .bl-risk{font-size:11px;color:var(--subtle);text-align:right}
  .wl-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .wl-item:last-child{border-bottom:none}
  .wl-icon{flex:none;width:34px;height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);padding:5px;color:var(--fg)}
  .wl-icon.kritik{color:var(--bad);border-color:rgba(226,84,62,.4)}
  .wl-icon.dikkat{color:var(--warn);border-color:rgba(232,185,62,.4)}
  .wl-name{font-size:14px;font-weight:700}
  .wl-level{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
  .wl-level.kritik{background:rgba(226,84,62,.15);color:var(--bad)}
  .wl-level.dikkat{background:rgba(232,185,62,.15);color:var(--warn)}
  .wl-meaning{font-size:13px;color:var(--muted);margin-top:3px}
  .search-box{margin-bottom:14px}
  .muted{color:var(--muted)}
  .empty{color:var(--subtle);font-size:14px;padding:10px 2px}
  footer{margin-top:26px;font-size:11px;color:var(--subtle);line-height:1.6;border-top:1px solid var(--border);padding-top:14px}
  .back-link{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 0 14px;display:block}
  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:0}
    .no-print{display:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Alır mıyım?</h1>
  <p class="lead">Bütçeni ve markayı gir — o paraya en sorunsuz kasayı, kronik arızalarını ve ekspertiz kontrol listesini görelim.</p>

  <div class="tabs no-print">
    <button class="tab active" data-tab="budget">Bütçeme Göre</button>
    <button class="tab" data-tab="light">Arıza Işığı</button>
  </div>

  <div id="tab-budget"></div>
  <div id="tab-light" style="display:none"></div>

  <footer class="no-print">
    Buradaki fiyat, risk ve arıza bilgileri bir ön tahmindir; ilan fiyatı ve gerçek durum değişebilir. Aracı almadan önce mutlaka bağımsız ekspertiz yaptırın.
    <br>alirmiyim.com
  </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// ---------- Sekmeler ----------
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const id = btn.dataset.tab;
    document.getElementById('tab-budget').style.display = id === 'budget' ? '' : 'none';
    document.getElementById('tab-light').style.display = id === 'light' ? '' : 'none';
  });
});

function fmtTL(n){ return n.toLocaleString('tr-TR') + ' TL'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function verdictBadge(advice){
  if (advice === DB_EXTRA.q3) return {cls:'ok', label: advice};
  if (advice === DB_EXTRA.nt3) return {cls:'bad', label: advice};
  return {cls:'warn', label: advice || DB_EXTRA.J3};
}

// ---------- Bütçe sekmesi ----------
const brandKeys = Object.keys(DB_Z3).sort((a,b) => DB_Z3[a].name.localeCompare(DB_Z3[b].name, 'tr'));

function renderBudgetTab(){
  const el = document.getElementById('tab-budget');
  el.innerHTML = `
    <div class="card">
      <div class="row">
        <div>
          <label>Bütçe (TL)</label>
          <input id="inBudget" class="field" inputmode="numeric" placeholder="1.250.000">
        </div>
      </div>
      <div class="row two">
        <div>
          <label>Marka</label>
          <select id="inBrand" class="field">
            <option value="">Marka seç</option>
            ${brandKeys.map(k => `<option value="${k}">${esc(DB_Z3[k].name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Model (opsiyonel)</label>
          <select id="inModel" class="field" disabled>
            <option value="">Önce marka</option>
          </select>
        </div>
      </div>
      <button class="btn" id="btnSearch">Göster</button>
      <p class="hint">Sadece bütçe + marka girerek de arayabilirsin; model seçmen şart değil.</p>
    </div>
    <div id="budgetResult"></div>
  `;

  const inBudget = document.getElementById('inBudget');
  const inBrand = document.getElementById('inBrand');
  const inModel = document.getElementById('inModel');
  const btn = document.getElementById('btnSearch');

  inBudget.addEventListener('input', () => {
    const digits = inBudget.value.replace(/\D/g, '');
    inBudget.value = digits ? Number(digits).toLocaleString('tr-TR') : '';
  });

  inBrand.addEventListener('change', () => {
    const brand = DB_Z3[inBrand.value];
    if (!brand) {
      inModel.disabled = true;
      inModel.innerHTML = '<option value="">Önce marka</option>';
      return;
    }
    inModel.disabled = false;
    const modelKeys = Object.keys(brand.models).sort((a,b) => brand.models[a].name.localeCompare(brand.models[b].name, 'tr'));
    inModel.innerHTML = '<option value="">Model seç (opsiyonel)</option>' +
      modelKeys.map(k => `<option value="${k}">${esc(brand.models[k].name)}</option>`).join('');
  });

  btn.addEventListener('click', () => {
    const budget = Number(inBudget.value.replace(/\D/g, '')) || 0;
    const brandKey = inBrand.value;
    const modelKey = inModel.value;
    runBudgetSearch(budget, brandKey, modelKey);
  });
}

function runBudgetSearch(budget, brandKey, modelKey){
  const out = document.getElementById('budgetResult');
  if (!brandKey) { out.innerHTML = '<p class="empty">Lütfen bir marka seç.</p>'; return; }
  if (!Number.isFinite(budget) || budget < 80000) { out.innerHTML = '<p class="empty">Lütfen geçerli bir bütçe gir (en az 80.000 TL).</p>'; return; }

  if (modelKey) {
    const best = findBestGeneration(brandKey, modelKey, budget);
    if (!best) { out.innerHTML = '<p class="empty">Bu model için veri bulunamadı.</p>'; return; }
    const card = buildResultCard(brandKey, modelKey, best);
    out.innerHTML = renderResultCard(card);
    bindCardEvents(out, card);
    return;
  }

  const list = searchBrandByBudget(brandKey, budget);
  if (!list.length) { out.innerHTML = '<p class="empty">Bu bütçe aralığında uygun model bulunamadı. Tutarı biraz değiştir.</p>'; return; }
  out.innerHTML = `
    <p class="section-title">Bu bütçeye yakın, en sorunsuz ${esc(DB_Z3[brandKey].name)} modelleri</p>
    <ul class="brand-list">
      ${list.map((r,i) => `
        <li><button data-idx="${i}">
          <span>
            <span class="bl-name">${esc(r.modelName)}${r.variantName && r.variantName !== r.modelName ? ' — ' + esc(r.variantName) : ''}</span><br>
            <span class="bl-gen">${r.year} · risk ${r.gen.risk}/100</span>
          </span>
          <span>
            <span class="bl-price">${fmtTL(r.est.mid)}</span><br>
            <span class="bl-risk">${fmtTL(r.est.low)}–${fmtTL(r.est.high)}</span>
          </span>
        </button></li>
      `).join('')}
    </ul>
  `;
  out.querySelectorAll('button[data-idx]').forEach(b => {
    b.addEventListener('click', () => {
      const r = list[Number(b.dataset.idx)];
      const card = buildResultCard(r.brandKey, r.modelKey, r);
      out.innerHTML = `<button class="back-link">&larr; Listeye dön</button>` + renderResultCard(card);
      out.querySelector('.back-link').addEventListener('click', () => runBudgetSearch(budget, brandKey, ''));
      bindCardEvents(out, card);
    });
  });
}

function renderResultCard(card){
  const badge = verdictBadge(card.advice);
  const riskPct = Math.max(4, Math.min(100, card.risk));
  const riskColor = card.risk >= 65 ? 'var(--bad)' : card.risk >= 40 ? 'var(--warn)' : 'var(--good)';
  return `
  <div class="card result" id="printArea">
    <div class="result-head">
      <div>
        <div class="result-title">${esc(card.brandName)} ${esc(card.genLabel)}</div>
        <div class="result-sub">${card.year} model civarı · bu bütçeye en uygun / en sorunsuz kasa</div>
      </div>
      <span class="badge ${badge.cls}">${esc(badge.label)}</span>
    </div>

    <div class="price">${fmtTL(card.price.mid)}</div>
    <div class="price-range">${fmtTL(card.price.low)} – ${fmtTL(card.price.high)} aralığında beklenebilir</div>
    <div class="risk-bar"><div class="risk-fill" style="width:${riskPct}%;background:${riskColor}"></div></div>
    <div class="hint">Risk skoru: ${card.risk}/100 — kesin sonuç için ekspertiz şart.</div>

    <a class="link-btn no-print" href="${card.sahibinden}" target="_blank" rel="noopener">
      🔎 sahibinden.com'da güncel ilanları gör
    </a>

    <p class="section-title">Kronik sorunlar</p>
    ${card.chronic.length ? card.chronic.map(c => `
      <div class="chronic-row freq-${c.freq === 'sık' ? 'sik' : 'diger'}">
        <div style="flex:1">
          <div class="chronic-title">${esc(c.title)}</div>
          <div class="chronic-meta">${esc(c.when || '')}</div>
          <div class="chronic-symptoms">${esc(c.symptoms || '')}</div>
        </div>
        <span class="freq-tag freq-${c.freq === 'sık' ? 'sik' : 'diger'}">${c.freq === 'sık' ? 'SIK' : 'AZ'}</span>
      </div>
    `).join('') : '<p class="empty">Bu kasa için kayıtlı kronik sorun bulunamadı — yine de ekspertiz şart.</p>'}

    <p class="section-title">Ekspertizde kontrol edilecekler</p>
    ${card.ekspertiz.map(e => `
      <div class="ek-item">
        <div class="item">☐ ${esc(e.item)}</div>
        <div class="why">${esc(e.why)}</div>
      </div>
    `).join('')}

    <button class="btn secondary no-print" id="btnPdf" style="margin-top:16px">PDF olarak indir / yazdır</button>
  </div>
  `;
}

function bindCardEvents(container, card){
  const btn = container.querySelector('#btnPdf');
  if (btn) btn.addEventListener('click', () => window.print());
}

// ---------- Arıza Işığı sekmesi ----------
function renderLightTab(){
  const el = document.getElementById('tab-light');
  el.innerHTML = `
    <div class="card">
      <p class="section-title" style="margin-top:0">Arıza ışığını tanı</p>
      <p class="hint" style="margin-top:0">Aracını seç (yıl opsiyonel) — panelindeki ışıklar ikon olarak listelensin. Aracını seçmesen de tüm ışıkları görebilirsin.</p>
      <div class="row two">
        <div>
          <label>Marka</label>
          <select id="wlBrand" class="field">
            <option value="">Marka seç</option>
            ${brandKeys.map(k => `<option value="${k}">${esc(DB_Z3[k].name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Model</label>
          <select id="wlModel" class="field" disabled><option value="">Önce marka</option></select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Yıl (opsiyonel)</label>
          <input id="wlYear" class="field" inputmode="numeric" placeholder="örn. 2018">
        </div>
      </div>
      <input id="wlSearch" class="field search-box" placeholder="ışık ara: örn. fren, akü, ABS...">
      <p class="hint" id="wlNote" style="margin-top:0"></p>
      <div id="wlList"></div>
    </div>
  `;
  const wlBrand = document.getElementById('wlBrand');
  const wlModel = document.getElementById('wlModel');
  const wlYear = document.getElementById('wlYear');
  const search = document.getElementById('wlSearch');

  const renderList = () => {
    const term = (search.value || '').trim().toLocaleLowerCase('tr');
    const year = Number(wlYear.value) || null;
    let items = applicableLights(wlBrand.value, wlModel.value, year);
    document.getElementById('wlNote').textContent = (wlBrand.value && wlModel.value)
      ? `${DB_Z3[wlBrand.value].name} ${DB_Z3[wlBrand.value].models[wlModel.value].name} için ${items.length} ışık gösteriliyor.`
      : 'Bu semboller neredeyse tüm araçlarda ortaktır.';
    if (term) items = items.filter(w =>
      w.name.tr.toLocaleLowerCase('tr').includes(term) ||
      w.meaning.tr.toLocaleLowerCase('tr').includes(term));
    document.getElementById('wlList').innerHTML = items.length ? items.map(w => `
      <div class="wl-item">
        <span class="wl-icon ${w.level}">${svgIcon(w.type)}</span>
        <div>
          <span class="wl-name">${esc(w.name.tr)}</span>
          <span class="wl-level ${w.level}">${w.level === 'kritik' ? 'Kritik — sürüşe devam etmeyin' : 'Dikkat — en kısa zamanda servise götürün'}</span>
          <div class="wl-meaning">${esc(w.meaning.tr)}</div>
        </div>
      </div>
    `).join('') : '<p class="empty">Eşleşen ışık bulunamadı.</p>';
  };

  wlBrand.addEventListener('change', () => {
    const brand = DB_Z3[wlBrand.value];
    if (!brand) { wlModel.disabled = true; wlModel.innerHTML = '<option value="">Önce marka</option>'; renderList(); return; }
    wlModel.disabled = false;
    const modelKeys = Object.keys(brand.models).sort((a,b) => brand.models[a].name.localeCompare(brand.models[b].name, 'tr'));
    wlModel.innerHTML = '<option value="">Model seç</option>' + modelKeys.map(k => `<option value="${k}">${esc(brand.models[k].name)}</option>`).join('');
    renderList();
  });
  wlModel.addEventListener('change', renderList);
  wlYear.addEventListener('input', () => { wlYear.value = wlYear.value.replace(/\D/g,'').slice(0,4); renderList(); });
  search.addEventListener('input', renderList);

  renderList();
}

renderBudgetTab();
renderLightTab();
</script>
</body>
</html>
